[project]
name = "dsh-vts-avatar"
version = "0.1.0"
description = "Drive a VTube Studio avatar from DSH dialogue: phoneme-timed mouth, continuous expression, head/body motion, NDI self-view."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "websockets>=14",
  "sounddevice>=0.5",
  "orjson>=3.10",
  "piper-tts>=1.6",
  "ndi-python>=6.0",
  "opencv-python-headless>=4.10",
]

[project.scripts]
dsh-vts = "dsh_vts_avatar.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
